server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router SPA fallback — every unmatched path serves index.html so
    # client-side routing (e.g. /mailboxes, /admin/cells) works on a
    # hard refresh or direct link, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
