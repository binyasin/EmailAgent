[project]
name = "emailagent-control-plane"
version = "0.1.0"
description = "SaaS control plane for the OpenClaw-based AI Email Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "structlog>=24.4",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.145",
    "requests>=2.32",
    "msal>=1.31",
    "jinja2>=3.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "stripe>=11.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "json5>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
