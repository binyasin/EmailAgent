apiVersion: v1
kind: Service
metadata:
  name: {{ include "emailagent.fullname" . }}-dashboard
  labels:
    {{- include "emailagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.dashboard.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "emailagent.dashboard.selectorLabels" . | nindent 4 }}
