apiVersion: v1
kind: Service
metadata:
  name: {{ include "emailagent.fullname" . }}-control-plane
  labels:
    {{- include "emailagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.controlPlane.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "emailagent.controlPlane.selectorLabels" . | nindent 4 }}
