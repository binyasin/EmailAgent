name: emailagent-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emailagent
      POSTGRES_PASSWORD: emailagent
      POSTGRES_DB: emailagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: ../control-plane
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://emailagent:emailagent@postgres:5432/emailagent
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../control-plane/app:/app/app

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile.dev
    env_file:
      - ../.env
    ports:
      - "5173:5173"
    depends_on:
      - control-plane
    volumes:
      - ../dashboard/src:/app/src
      - ../dashboard/public:/app/public

  # Single-tenant OpenClaw Gateway for Phase 1/2. Phase 3 replaces this
  # static service with per-tenant containers spun up by
  # `cell_provisioner.py` via the Fleet CLI (see docs/architecture.md).
  openclaw:
    image: openclaw/openclaw:latest
    env_file:
      # CELL_SERVICE_TOKEN must be set in .env before this service starts —
      # gmail-mcp/outlook-mcp require it at process start and use it to
      # authenticate to the control plane, which derives the org (dev-org)
      # from the token itself. Run `python -m app.scripts.seed_dev_org`
      # (after migrations) to mint one, then restart this service if it was
      # already running. See docs/phase1-runbook.md.
      - ../.env
    environment:
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:8000
    ports:
      - "18789:18789"
    depends_on:
      - control-plane
    volumes:
      - ../agent-runtime/templates/dev-openclaw.json5:/root/.openclaw/openclaw.json:ro
      - ../agent-runtime/templates/dev-cron-jobs.json5:/root/.openclaw/cron/jobs.json:ro
      - ../agent-runtime/skills:/root/.openclaw/skills:ro
      - ../agent-runtime/mcp-servers/gmail-mcp:/opt/agent-runtime/mcp-servers/gmail-mcp:ro
      - ../agent-runtime/mcp-servers/outlook-mcp:/opt/agent-runtime/mcp-servers/outlook-mcp:ro
      - ../agent-runtime/heartbeat/HEARTBEAT.md:/home/openclaw/workspace/HEARTBEAT.md:ro
      - ../agent-runtime/templates/style-profile.md:/home/openclaw/workspace/style-profile.md
      - ../agent-runtime/templates/vip-list.md:/home/openclaw/workspace/vip-list.md
      - openclaw-state:/root/.openclaw/state

volumes:
  postgres-data:
  openclaw-state:
